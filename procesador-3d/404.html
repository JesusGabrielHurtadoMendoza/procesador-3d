<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Procesador 3D</title>
<meta name="theme-color" content="#0B1016">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#15202b,#0B1016 60%);color:#E4ECF2;font:16px/1.5 'Segoe UI',system-ui,sans-serif;text-align:center;padding:24px}
  .chip{width:90px;height:90px;margin:0 auto 18px;border:4px solid #D08A4E;border-radius:14px;display:grid;place-items:center;animation:t 1.6s ease-in-out infinite}
  .chip i{width:40px;height:40px;border-radius:6px;background:#E0685A}
  @keyframes t{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  h1{font-size:30px;margin:0 0 6px} p{color:#8FA0B0;margin:0 0 20px}
  a{display:inline-block;background:#D08A4E;color:#1B0F05;font-weight:600;text-decoration:none;padding:10px 16px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){.chip{animation:none}}
</style>
</head>
<body>
<main>
  <div class="chip" aria-hidden="true"><i></i></div>
  <h1>Error 404: esta dirección no existe</h1>
  <p>El procesador buscó la página en su caché y en la RAM, y no la encontró.</p>
  <a href="./">Volver a Procesador 3D</a>
</main>
</body>
</html>
